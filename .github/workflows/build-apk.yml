name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Add google-services.json (push notifications, optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: if [ -n "$GS" ]; then echo "$GS" | base64 -d > google-services.json; fi
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
